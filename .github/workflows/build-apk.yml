name: Construire l'APK

on:
  push:
    branches: [ main, agent-ia ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK de test
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk mizan-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mizan-debug-apk
          path: mizan-debug.apk

      - name: Publier une version de test
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.10.${{ github.run_number }}
          name: Mizan v0.10 (test ${{ github.run_number }})
          prerelease: true
          files: mizan-debug.apk

      - name: Publier une version de test de l'assistant
        if: github.ref == 'refs/heads/agent-ia'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-ia-${{ github.run_number }}
          name: Mizan + assistant IA (test ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: mizan-debug.apk

      - name: Garder le dernier APK sur la branche apk
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rf --cached . -q
          git add -f mizan-debug.apk
          git commit -q -m "APK de test ${GITHUB_SHA::7}"
          git push -f origin apk
